_schema-version: 3.3.0
ID: oilAndGas_Tracking_ui
version: 1.0.0
description: "Standalone Fiori UI for Oil & Gas Tracking (no auth, connects directly to the deployed backend OData service)"

modules:
  - name: oilandgas-tracking-ui
    type: html5
    path: webapp
    parameters:
      version: 1.0.0-${timestamp}
    build-parameters:
      build-result: .
    requires:
      - name: oilAndGas-html5-repo-host

resources:
  - name: oilAndGas-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
