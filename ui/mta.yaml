_schema-version: 3.3.0
ID: oilAndGas_Tracking_ui
version: 1.0.0
description: "Standalone Fiori UI for Oil & Gas Tracking (no auth, connects directly to the deployed backend OData service)"

modules:
  - name: oilandgas-tracking-ui
    type: html5
    path: webapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - mkdir -p dist
        - cp -r Component.js index.html manifest.json xs-app.json i18n controller view dist/
        - bash -c "cd dist && zip -r webapp.zip . -x webapp.zip"
      supported-platforms: []

  - name: oilandgas-tracking-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: oilAndGas-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: oilandgas-tracking-ui
          artifacts:
            - webapp.zip
          target-path: resources/

resources:
  - name: oilAndGas-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
