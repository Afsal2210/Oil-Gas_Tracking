_schema-version: 3.3.0
ID: oilAndGas_Tracking
version: 1.0.0
description: "Oil & Gas Tracking - backend (CAP service) + standalone Fiori UI, deployed together"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - bash -c "cd backend && npm ci && npx cds build --production"
        - bash -c "mkdir -p approuter/resources && cp -r ui/webapp/. approuter/resources/"

modules:
  - name: oilAndGas_Tracking-srv
    type: nodejs
    path: backend/gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: oilAndGas_Tracking-db
      - name: oilAndGas_Tracking-auth

  - name: oilAndGas_Tracking-db-deployer
    type: hdb
    path: backend/gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: oilAndGas_Tracking-db

  - name: oilandgas-tracking-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must match the "destination" used in approuter/xs-app.json
          url: ~{srv-url}
          forwardAuthToken: true
      - name: oilAndGas_Tracking-auth

resources:
  - name: oilAndGas_Tracking-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./backend/xs-security.json

  - name: oilAndGas_Tracking-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
