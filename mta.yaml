_schema-version: 3.3.0
ID: oilAndGas_Tracking
version: 1.0.0
description: "Oil & Gas Tracking - backend (CAP service) + standalone Fiori UI, deployed together"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - bash -c "cd backend && npm ci && npx cds build --production"

modules:
  - name: oilAndGas_Tracking-srv
    type: nodejs
    path: backend/gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: oilAndGas_Tracking-db
      - name: oilAndGas_Tracking-auth

  - name: oilAndGas_Tracking-db-deployer
    type: hdb
    path: backend/gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: oilAndGas_Tracking-db

  - name: oilandgas-tracking-ui
    type: html5
    path: ui/webapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - mkdir -p dist
        - cp -r Component.js index.html manifest.json xs-app.json i18n controller view dist/
        - bash -c "cd dist && jar cf ../webapp.zip . && mv ../webapp.zip ./webapp.zip"
      supported-platforms: []

  - name: oilandgas-tracking-ui-deployer
    type: com.sap.application.content
    path: ui
    requires:
      - name: oilAndGas-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: oilandgas-tracking-ui
          artifacts:
            - webapp.zip
          target-path: resources/

resources:
  - name: oilAndGas_Tracking-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./backend/xs-security.json

  - name: oilAndGas_Tracking-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

      
  - name: oilAndGas_Tracking-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: oilAndGas-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: oilAndGas-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
